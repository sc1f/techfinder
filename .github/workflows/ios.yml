# Builds TechFinder with the latest Xcode (iOS 26+ SDK, so Liquid Glass is compiled in),
# runs the tests, and on demand uploads a build to TestFlight.
#
# TestFlight needs these repository secrets (Settings › Secrets and variables › Actions):
#   APPLE_TEAM_ID   10-character Team ID (developer.apple.com › Membership)
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   App Store Connect API issuer ID
#   ASC_KEY_P8      Full contents of the AuthKey_XXXXXXXXXX.p8 file
# The API key needs the Admin role so Xcode can create the distribution certificate and profile.
name: iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload a build to TestFlight
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Pick an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "Using simulator $udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          set -o pipefail
          # Boot first so the UI tests' app launch doesn't race the Simulator starting up.
          xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b >/dev/null
          xcodebuild test \
            -project TechFinder.xcodeproj \
            -scheme TechFinder \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -retry-tests-on-failure \
            -test-iterations 2 \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning:|Executed|TEST (SUCCEEDED|FAILED)"

      # Launches the app in the Simulator to catch hangs (a SwiftUI layout loop shows up as a pinned CPU)
      # and saves screenshots of the main states for review.
      - name: Launch check and screenshots
        run: |
          set -o pipefail
          xcodebuild build \
            -project TechFinder.xcodeproj \
            -scheme TechFinder \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/sim" \
            | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
          app="$RUNNER_TEMP/sim/Build/Products/Debug-iphonesimulator/TechFinder.app"
          xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b >/dev/null
          xcrun simctl install "$SIMULATOR_UDID" "$app"
          mkdir -p "$RUNNER_TEMP/screens"
          failed=0
          shoot() {
            name="$1"; shift
            xcrun simctl terminate "$SIMULATOR_UDID" com.scif.TechFinder 2>/dev/null || true
            xcrun simctl launch "$SIMULATOR_UDID" com.scif.TechFinder "$@" >/dev/null
            sleep 15
            pid="$(pgrep -f 'TechFinder.app/TechFinder' | head -1)"
            if [ -z "$pid" ]; then echo "::error::TechFinder is not running ($name)"; failed=1; return; fi
            cpu=0
            for _ in 1 2 3; do cpu=$(echo "$cpu + $(ps -o %cpu= -p "$pid" | tr -d ' ')" | bc); sleep 1; done
            echo "$name: average CPU $(echo "$cpu / 3" | bc)%"
            if [ "$(echo "$cpu / 3 > 80" | bc)" = 1 ]; then echo "::error::TechFinder looks hung ($name)"; failed=1; fi
            xcrun simctl io "$SIMULATOR_UDID" screenshot "$RUNNER_TEMP/screens/$name.png" >/dev/null
          }
          shoot 1-viewfinder
          shoot 2-lenses -TFPresent lenses
          shoot 3-landscape-left -TFSimulateHold landscapeLeft
          shoot 4-landscape-right-formats -TFSimulateHold landscapeRight -TFPresent formats
          shoot 5-movements-result -TFImageCircle 90 -TFMovements YES -TFRise 8 -TFShift 4 -TFOverview NO
          shoot 6-movements-overview -TFImageCircle 90 -TFMovements YES -TFRise 8 -TFShift 4 -TFOverview YES
          exit $failed

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screens
          retention-days: 14

      # An unsigned Release build for iPhone, so a free Apple ID can sign and install it locally with
      # scripts/install-liquid-glass.sh (Liquid Glass needs this newer SDK).
      - name: Build unsigned iPhone app
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          xcodebuild build \
            -project TechFinder.xcodeproj \
            -scheme TechFinder \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/device" \
            CODE_SIGNING_ALLOWED=NO \
            | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
          cd "$RUNNER_TEMP/device/Build/Products/Release-iphoneos"
          ditto -c -k --keepParent TechFinder.app "$RUNNER_TEMP/TechFinder-unsigned.zip"

      - name: Upload unsigned iPhone app
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: TechFinder-iphoneos-unsigned
          path: ${{ runner.temp }}/TechFinder-unsigned.zip
          retention-days: 30

      # Includes the UI tests' screenshots (menu open, sheets); upload even on success for review.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/xcodebuild.log

  testflight:
    name: Upload to TestFlight
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.testflight)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check secrets
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; missing=1; fi
          done
          exit $missing

      - name: Install API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project TechFinder.xcodeproj \
            -scheme TechFinder \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/TechFinder.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | grep -E "error:|warning:|ARCHIVE (SUCCEEDED|FAILED)"

      - name: Export and upload
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TechFinder.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | grep -E "error:|warning:|Upload|EXPORT (SUCCEEDED|FAILED)"
          echo "Uploaded build ${{ github.run_number }}. It appears in TestFlight after Apple finishes processing (usually 5–15 minutes)."

      - name: Remove API key
        if: always()
        run: rm -f "$ASC_KEY_PATH"
