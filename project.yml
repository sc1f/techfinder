# Generates TechFinder.xcodeproj. After changing this file run: xcodegen generate
name: TechFinder
options:
  bundleIdPrefix: com.scif
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer team here (or in Xcode › Signing & Capabilities) to run on an iPhone.
    DEVELOPMENT_TEAM: ""
packages:
  TechFinderCore:
    path: Packages/TechFinderCore
targets:
  TechFinder:
    type: application
    platform: iOS
    sources:
      - path: TechFinder
    dependencies:
      - package: TechFinderCore
        product: TechFinderCore
    info:
      path: TechFinder/Info.plist
      properties:
        CFBundleDisplayName: TechFinder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: TechFinder shows your composition through the iPhone camera, framed for your lens and format.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scif.TechFinder
        PRODUCT_NAME: TechFinder
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  TechFinderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TechFinderUITests
    dependencies:
      - target: TechFinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scif.TechFinderUITests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  TechFinder:
    build:
      targets:
        TechFinder: all
    run:
      config: Debug
    test:
      config: Debug
      # UI tests launch the app themselves; attaching the debugger makes launches time out on CI.
      debugEnabled: false
      targets:
        - package: TechFinderCore/TechFinderCoreTests
        - TechFinderUITests
    archive:
      config: Release
